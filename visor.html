<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fotos del registro</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f3f5f8;color:#222}
header{background:#1f4e78;color:#fff;padding:14px 22px}
header h1{margin:0;font-size:20px}header p{margin:4px 0 0;opacity:.85;font-size:14px}
main{padding:18px 22px}
details{background:#fff;border:1px solid #d5dae1;border-radius:8px;padding:8px 14px;margin-bottom:18px}
summary{cursor:pointer;font-weight:600}
table{border-collapse:collapse;margin-top:8px;font-size:13px}
th{text-align:left;padding:3px 14px 3px 0;color:#555;vertical-align:top}td{padding:3px 0;word-break:break-word}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
figure{margin:0;background:#fff;border:1px solid #d5dae1;border-radius:8px;overflow:hidden}
figure img{width:100%;display:block;background:#e8ebef;min-height:120px;object-fit:contain;max-height:480px}
figcaption{padding:6px 10px;font-size:13px;color:#555}
#msg{padding:20px;color:#a00}
</style></head><body>
<header><h1 id="t">Cargando…</h1><p id="s"></p></header>
<main><div id="msg"></div><div id="datos"></div><div class="grid" id="g"></div></main>
<script>
const SERVICIO = 'https://PEGA-AQUI-LA-URL-DE-TU-CAPA/FeatureServer/0';
const p = new URLSearchParams(location.search);
const oid = p.get('oid'), token = p.get('token');
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const tk = sep => token ? `${sep}token=${encodeURIComponent(token)}` : '';
(async () => {
  try {
    if (!oid) throw new Error('Falta el parámetro oid en el link.');
    const [a, f] = await Promise.all([
      fetch(`${SERVICIO}/${oid}/attachments?f=json${tk('&')}`, { credentials: 'include' }).then(r => r.json()),
      fetch(`${SERVICIO}/${oid}?f=json${tk('&')}`, { credentials: 'include' }).then(r => r.json())
    ]);
    if (a.error) throw new Error(a.error.message || 'Error al leer adjuntos (¿requiere sesión?)');
    const fotos = (a.attachmentInfos || []).filter(x => (x.contentType || '').startsWith('image'));
    const at = (f.feature && f.feature.attributes) || {};
    document.title = `Registro ${oid}`;
    document.getElementById('t').textContent = `Registro ${oid}`;
    document.getElementById('s').textContent = `${at.registro ?? ''} ${at.actividad ?? ''} · ${at.fechador ?? ''} · ${fotos.length} foto${fotos.length === 1 ? '' : 's'}`;
    const filas = Object.entries(at).filter(([k, v]) => v != null && String(v).trim() !== '')
      .map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('');
    document.getElementById('datos').innerHTML = `<details><summary>Datos del registro</summary><table>${filas}</table></details>`;
    document.getElementById('g').innerHTML = fotos.map((x, i) => {
      const u = `${SERVICIO}/${oid}/attachments/${x.id}${tk('?')}`;
      return `<figure><a href="${esc(u)}" target="_blank"><img src="${esc(u)}" loading="lazy" alt="${esc(x.name)}"></a><figcaption>${i + 1}. ${esc(x.name)}</figcaption></figure>`;
    }).join('');
  } catch (e) { document.getElementById('msg').textContent = 'Error: ' + e.message; }
})();
</script></body></html>
